# Runs the definition-of-done gate (CLAUDE.md) on Linux and Windows (OPS-1).
# The toolchain comes only from rust-toolchain.toml; no version is named here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # Keep committed LF line endings on Windows so byte-exact fixture tests see the same bytes as on Linux.
      - name: Disable line-ending conversion
        run: git config --global core.autocrlf false
      - name: Check out
        uses: actions/checkout@v5
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Show toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
