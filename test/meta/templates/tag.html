{% extends "base.html" %}

{% block title %}#{{ tag.name }} | {{ super() }}{% endblock title %}

{% block content %}
<h1>{{ tag.name }}</h1>

<ul class="tag-page-list">
{% for page in tag.pages %}
  <li>
    <a href="{{ page.url | safe }}">{{ page.title }}</a>
    {% if page.date %}<time>{{ page.date }}</time>{% endif %}
  </li>
{% endfor %}
</ul>
{% endblock content %}
